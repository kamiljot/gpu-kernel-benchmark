name: Build & Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.3.0'

      - name: Install GCC 12 and set as default
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 20
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 20
          gcc --version

      - name: Install dependencies
        run: |
          sudo apt-get install -y cmake python3

      - name: Build project
        run: |
          cmake --preset linux-ci
          cmake --build --preset linux-ci

      - name: Run tests
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            ctest --preset linux-ci
          else
            echo "No NVIDIA GPU/driver detected on this runner; skipping CUDA runtime tests."
          fi
